name: Test

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The other MOCA repositories, at fixed refs: release tags, or commits before a release; never a branch
# (moca-spec CONTRIBUTING.md).
env:
  MOCA_SPEC_REF: af2310432b374c8e6882ed813effdf85a01d25f8  # release-0.7.0; v0.7.0 once tagged
  MOCA_READER_DOTNET_REF: a8255e1aaec77e0d6ffaf49e026f9d515798a455  # draft/0.7.0-terms-rights (terms, hardening); v0.7.0 once tagged

jobs:
  deps:
    name: Public dependencies only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: moca-mcp-dotnet
      # The check lives in moca-spec, the one copy every open repository runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          # Read access to the other MOCA repos while they are private.
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node moca-spec/scripts/check-deps.mjs moca-mcp-dotnet

  test:
    name: Test, with the expected answers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: moca-mcp-dotnet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: moca-mcp-dotnet/global.json
      # OpenMoca.Reader 0.7.0 is packed from moca-reader-dotnet at a pinned commit until it is on NuGet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-reader-dotnet
          ref: ${{ env.MOCA_READER_DOTNET_REF }}
          path: moca-reader-dotnet
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - run: dotnet pack -c Release -o "$RUNNER_TEMP/feed"
        working-directory: moca-reader-dotnet
      - run: dotnet build moca-mcp-dotnet.slnx -c Release -p:RestoreAdditionalProjectSources="$RUNNER_TEMP/feed"
        working-directory: moca-mcp-dotnet
      # One standard model for the semantic tests, fetched by the server's own command (pinned commit and SHA-256).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/models
          key: models-bge-small-en-v1.5-ea104dacec62c0de699686887e3f920caeb4f3e3
      - run: dotnet src/OpenMoca.Mcp/bin/Release/net10.0/moca-mcp.dll models add bge-small-en-v1.5 --models "$RUNNER_TEMP/models"
        working-directory: moca-mcp-dotnet
      - run: dotnet test --project tests/OpenMoca.Mcp.Tests -c Release --no-build
        working-directory: moca-mcp-dotnet
        env:
          MOCA_TEST_MODELS: ${{ runner.temp }}/models
